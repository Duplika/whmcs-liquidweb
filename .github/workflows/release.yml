name: Validate and publish beta

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: PHP syntax and offline checks
        run: |
          php --version
          find modules tests tools -name '*.php' -print0 | xargs -0 -n1 php -l
          php tests/smoke.php
          php tests/firewall.php
          php tests/language.php

  release:
    if: github.event_name == 'push' && github.event.head_commit.message == 'Release v0.2.1-beta.1'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build minimal installation package
        run: |
          zip -r liquidweb-whmcs-0.2.1-beta.1.zip README.md LICENSE modules/servers/liquidweb
          test "$(unzip -Z1 liquidweb-whmcs-0.2.1-beta.1.zip | grep -v '/$' | wc -l)" -eq 13
          sha256sum liquidweb-whmcs-0.2.1-beta.1.zip > SHA256SUMS.txt
          cat > release-notes.md <<'NOTES'
          English and Spanish client-area translations by Duplika, under the MIT License.

          - Uses the active WHMCS locale and native Lang::trans overrides.
          - Translates server information, known status labels, network chart text and suspension/payment notices.
          - Separates session caches by locale to support native language switching.
          - English fallback for other languages; no new setting, browser detection or provider requests.

          Replace the complete modules/servers/liquidweb directory, including lib/Text.php and both lang catalogs. Clear the WHMCS template cache if older text remains. Existing firewall snapshots and native suspension/reactivation behavior are preserved; do not repeat a completed snapshot import.

          Download liquidweb-whmcs-0.2.1-beta.1.zip and follow README.md. The ZIP contains only the module, README and LICENSE. SHA256SUMS.txt provides its checksum.

          PHP syntax, firewall tests and offline native-locale/translation/switching/escaping tests pass before publication. Verify Spanish and English in your WHMCS theme. Live lifecycle/payment integration still needs the installation-level pilot.
          NOTES
      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create v0.2.1-beta.1 \
            --target "$GITHUB_SHA" --prerelease \
            --title 'v0.2.1-beta.1 — Spanish client-area translations' \
            --notes-file release-notes.md \
            liquidweb-whmcs-0.2.1-beta.1.zip SHA256SUMS.txt
