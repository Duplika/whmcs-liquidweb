name: Validate and publish beta

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: PHP syntax and offline checks
        run: |
          php --version
          find modules tests -name '*.php' -print0 | xargs -0 -n1 php -l
          php tests/smoke.php

  release:
    if: github.event_name == 'push' && github.event.head_commit.message == 'Release v0.1.7-beta.1'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build minimal installation package
        run: |
          zip liquidweb-whmcs-0.1.7-beta.1.zip README.md LICENSE \
            modules/servers/liquidweb/liquidweb.php \
            modules/servers/liquidweb/clientarea.tpl \
            modules/servers/liquidweb/lib/Api.php \
            modules/servers/liquidweb/lib/Network.php
          test "$(unzip -Z1 liquidweb-whmcs-0.1.7-beta.1.zip | wc -l)" -eq 6
          sha256sum liquidweb-whmcs-0.1.7-beta.1.zip > SHA256SUMS.txt
          cat > release-notes.md <<'NOTES'
          Initial public beta by Duplika, under the MIT License.

          - Read-only server status, operating system and location when available.
          - Network history loaded on demand, using a local SVG chart.
          - v3 for basic details; v2 only for network history.
          - English interface and installation instructions.

          All provisioning and administration remain manual. No backups, CPU/RAM utilization, service health or server controls are included.

          Download liquidweb-whmcs-0.1.7-beta.1.zip below and follow README.md. The install package contains only six files; development tests and workflows are excluded. SHA256SUMS.txt provides its checksum.

          PHP syntax and offline tests pass before publication. Live WHMCS/API compatibility still requires testing; see the README for pilot observations and API limitations.
          NOTES
      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create v0.1.7-beta.1 \
            --target "$GITHUB_SHA" --prerelease \
            --title 'v0.1.7-beta.1 — Initial public beta' \
            --notes-file release-notes.md \
            liquidweb-whmcs-0.1.7-beta.1.zip SHA256SUMS.txt
